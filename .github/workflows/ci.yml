name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-worker:
    name: Real Linux Worker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Start isolated Linux lab
        run: docker compose -f deploy/linux-worker/compose.yaml up -d --build
      - name: Real database and fault acceptance
        run: python .github/scripts/accept_linux_worker.py
      - name: End-to-end Worker MCP
        run: python .github/scripts/smoke_worker_mcp.py
      - name: Remove disposable lab
        if: always()
        run: docker compose -f deploy/linux-worker/compose.yaml down --volumes

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Validate Windows management scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('deploy/windows/Manage-SecretBox.ps1', 'deploy/linux-worker/Start-DockerDesktopSafe.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Validate request examples through the CLI
        run: >-
          python -c "from pathlib import Path; from openagent_secretbox.cli import main;
          results=[main(['--json','validate',str(path)]) for path in
          sorted(Path('examples').glob('*.request.json'))];
          raise SystemExit(max(results, default=1))"
      - name: Build wheel for installed-package smoke test
        if: matrix.python-version == '3.12'
        run: python -m build --wheel
      - name: Smoke test wheel outside the source tree
        if: matrix.python-version == '3.12'
        run: python .github/scripts/smoke_wheel.py

  quality:
    name: Static checks and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Build sdist and wheel
        run: python -m build
