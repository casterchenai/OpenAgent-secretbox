name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Validate request examples through the CLI
        run: >-
          python -c "from pathlib import Path; from openagent_secretbox.cli import main;
          results=[main(['--json','validate',str(path)]) for path in
          sorted(Path('examples').glob('*.request.json'))];
          raise SystemExit(max(results, default=1))"
      - name: Build wheel for installed-package smoke test
        if: matrix.python-version == '3.12'
        run: python -m build --wheel
      - name: Smoke test wheel outside the source tree
        if: matrix.python-version == '3.12'
        run: python .github/scripts/smoke_wheel.py

  quality:
    name: Static checks and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Build sdist and wheel
        run: python -m build
