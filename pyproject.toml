[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openagent-secretbox"
version = "0.0.0"
description = "Secure secret intake for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "casterchenai" }
]
keywords = ["ai-agent", "secrets", "env", "security", "credentials"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/casterchenai/OpenAgent-secretbox"
Repository = "https://github.com/casterchenai/OpenAgent-secretbox"
Issues = "https://github.com/casterchenai/OpenAgent-secretbox/issues"

[project.scripts]
secretbox = "openagent_secretbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_secretbox"]
